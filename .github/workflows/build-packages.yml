name: Build packages

on:
  workflow_dispatch:
    inputs:
      openwrt_majors:
        description: 'OpenWrt major versions (space-separated, e.g. 24 25)'
        required: false
        default: '24 25'
        type: string
  push:
    branches:
      - master
    paths:
      - 'honk/**'
      - 'luci-app-honk/**'
      - 'scripts/**'
      - '.github/workflows/build-packages.yml'

permissions:
  contents: write
  actions: write

env:
  OPENWRT_MAJORS: '24 25'

jobs:
  prepare:
    name: Prepare version and matrix
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      sdks: ${{ steps.matrix.outputs.sdks }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Generate version metadata
        id: meta
        shell: bash
        run: |
          pkg_version=$(grep '^PKG_VERSION:=' honk/Makefile | head -n 1 | cut -d= -f2)
          pkg_release=$(grep '^PKG_RELEASE:=' honk/Makefile | head -n 1 | cut -d= -f2)

          version="${pkg_version}-r${pkg_release}"
          # git ref 不允许 '~'（PKG_VERSION 的 Debian 风格分隔符），只在 tag 里替换
          release_tag="honk_$(printf '%s' "$version" | tr '~' '_')"
          release_name="honk_${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"

          echo "Version: ${version}"
          echo "Release tag: ${release_tag}"

      - name: Resolve latest SDK releases
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          raw_majors="${{ inputs.openwrt_majors }}"
          majors=$(echo "${raw_majors:-$OPENWRT_MAJORS}" | tr ',' ' ')
          echo "Target major versions: ${majors}"

          tags=""
          for i in {1..3}; do
            tags=$(git ls-remote --tags --refs https://github.com/openwrt/openwrt.git 2>/dev/null | awk -F'/' '{print $NF}' | sed 's/^v//' || true)
            [ -n "$tags" ] && break
            sleep 2
          done

          if [ -z "$tags" ]; then
            echo "::error::Failed to fetch tags from https://github.com/openwrt/openwrt.git"
            exit 1
          fi

          sdks=()
          for major in $majors; do
            latest=$(echo "$tags" | grep -E "^${major}\.[0-9.]+$" | sort -V | tail -n 1 || true)
            [ -z "$latest" ] && latest=$(echo "$tags" | grep -E "^${major}\." | sort -V | tail -n 1 || true)

            if [ -n "$latest" ]; then
              echo "OpenWrt ${major} -> ${latest}"
              sdks+=("$latest")
            else
              echo "::error::No OpenWrt release tag found for major: ${major}"
              exit 1
            fi
          done

          echo "sdks=$(jq -nc --args '$ARGS.positional' -- "${sdks[@]}")" >> "$GITHUB_OUTPUT"

  prebuild:
    name: Prebuild honk-core ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
          - x86_64

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Resolve honk toolchain pins
        id: honk-toolchain
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/honk_toolchain.sh | tee "$RUNNER_TEMP/honk-toolchain.env"
          . "$RUNNER_TEMP/honk-toolchain.env"
          echo "zig_version=${ZIG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev cmake libclang-dev zstd
          . "$RUNNER_TEMP/honk-toolchain.env"
          curl -fsSL --retry 3 -o /tmp/bpf-linker.tar.zst \
            "https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "${BPF_LINKER_SHA256}  /tmp/bpf-linker.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf /tmp/bpf-linker.tar.zst -C /usr/local/bin
          bpf-linker --version

      - name: Setup Zig for BoringSSL musl cross-compilation
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.honk-toolchain.outputs.zig_version }}

      - name: Build honk-core binary
        shell: bash
        run: |
          ./scripts/build_honk_core.sh "${{ matrix.arch }}" honk/files/honk-core.bin

      - name: Upload honk-core binary
        uses: actions/upload-artifact@v7
        with:
          name: honk-core-${{ matrix.arch }}
          path: honk/files/honk-core.bin
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build:
    name: Build ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - prebuild
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
          - x86_64
        sdk: ${{ fromJson(needs.prepare.outputs.sdks) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Download honk-core binary
        uses: actions/download-artifact@v8
        with:
          name: honk-core-${{ matrix.arch }}
          path: honk/files

      - name: Remove KERNEL_DEBUG_INFO_BTF dependency for CI
        shell: bash
        run: |
          # No KERNEL_DEBUG_INFO_BTF in the SDK: make the kernel-BTF choice
          # selectable so the conditional vmlinux-btf dep stays inactive.
          sed -i '/depends on KERNEL_DEBUG_INFO_BTF/d' honk/Makefile

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          CONTAINER: docker.io/openwrt/sdk
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: honk luci-app-honk
          NO_REFRESH_CHECK: true
          NO_SHFMT_CHECK: true

      - name: Prepare renamed artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in *honk*) ;; *) continue ;; esac
            ext="${base##*.}"
            name="${base%.*}"
            case "$name" in
              luci-*) new_name="${name}-openwrt-${{ matrix.sdk }}.${ext}" ;;
              *)      new_name="${name}-${{ matrix.arch }}-openwrt-${{ matrix.sdk }}.${ext}" ;;
            esac
            cp "$f" "dist/${new_name}"
          done < <(find bin/packages -type f \( -name '*.ipk' -o -name '*.apk' \) -print0)

          compgen -G 'dist/*' >/dev/null || {
            echo "::error::No package files were copied to dist"
            exit 1
          }

          ls -lah dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-dist
          merge-multiple: true
          pattern: '*-openwrt-*'

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          files: release-dist/*
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Old Releases
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true
          releases_keep_latest: 3
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 3
          gh_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
